name: SMC Testler

# Push/PR'da SMC dedektör mantığında regresyon var mı kontrol eder (ağsız).

on:
  push:
    paths:
      - "signal-bot/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "signal-bot/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: SMC + MTF birim testleri
        working-directory: signal-bot
        run: |
          python test_smc.py
          python test_mtf.py
          python bot.py --self-test
